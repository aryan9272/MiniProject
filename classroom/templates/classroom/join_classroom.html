{% extends 'classroom/base.html' %}
{% block title %}Join Classroom — CodeClass{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="cc-card p-4 p-md-5 text-center">
        <div class="cc-feature-icon mb-3"><i class="bi bi-door-open-fill"></i></div>
        <h3 class="fw-bold mb-1">Join a Classroom</h3>
        <p class="text-muted mb-4">Enter the 6-character code your professor shared with you.</p>

        <form method="POST">
          {% csrf_token %}
          <div class="mb-3">
            <input type="text"
                   name="join_code"
                   class="form-control form-control-lg text-center cc-code-input"
                   placeholder="e.g.  A3B9XZ"
                   maxlength="10"
                   style="letter-spacing: 6px; font-family: 'JetBrains Mono', monospace; font-size: 1.5rem;"
                   autofocus />
          </div>
          <button type="submit" class="btn cc-btn-primary w-100 py-2">
            <i class="bi bi-box-arrow-in-right me-2"></i>Join Classroom
          </button>
          <a href="{% url 'dashboard' %}" class="btn cc-btn-outline w-100 py-2 mt-2">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
