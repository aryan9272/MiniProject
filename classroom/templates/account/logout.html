{% extends 'classroom/base.html' %}
{% block title %}Sign Out — CodeClass{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-4">
      <div class="cc-card p-4 p-md-5 text-center">

        <div class="cc-feature-icon mx-auto mb-3">
          <i class="bi bi-box-arrow-right"></i>
        </div>
        <h3 class="fw-bold mb-1">Sign Out</h3>
        <p class="text-muted mb-4">Are you sure you want to sign out of CodeClass?</p>

        <form method="POST" action="{% url 'account_logout' %}">
          {% csrf_token %}
          <button type="submit" class="btn cc-btn-primary w-100 py-2 mb-2">
            Yes, Sign Out
          </button>
          <a href="{% url 'dashboard' %}" class="btn cc-btn-outline w-100 py-2">
            Cancel
          </a>
        </form>

      </div>
    </div>
  </div>
</div>
{% endblock %}
